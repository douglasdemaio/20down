[package]
name = "wagerwake"
version = "0.1.0"
description = "Escrow, fee and VRF-gated payout program for Dice & Cards"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "wagerwake"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.0.2", features = ["token", "associated_token"] }
sha2 = "0.10"
