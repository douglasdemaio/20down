[toolchain]
package_manager = "npm"
anchor_version = "1.0.2"
solana_version = "3.1.14"

[features]
resolution = true
skip-lint = false
seeds = false
skip_preflight = false

[programs.devnet]
wagerwake = "CrjnJ5xQjSYUw4vkKKRfWtQFCc58EoA82ZXodNDwjHXt"

[programs.localnet]
wagerwake = "CrjnJ5xQjSYUw4vkKKRfWtQFCc58EoA82ZXodNDwjHXt"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "cargo test --manifest-path programs/wagerwake/Cargo.toml"
